name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse host half
        run: node --check index.js
      - name: Parse client half
        run: node --check client.js
      - name: Smoke-test client module
        run: node test/smoke-client.cjs
      - name: Validate package payload
        run: npm pack --dry-run
